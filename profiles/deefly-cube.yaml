# Profil device : DeeFly-Cube (VMC double flux)
# Reference: DEE_FLY_CUBE
id: deefly-cube
name: "DeeFly Cube"
description: "VMC double flux"
type: vmc

# ── Produits ──
products:
  DEEFLY_CUBE:
    name: "DeeFly-Cube"
    reference_fields: []

# ── Mapping telemetrie → indicateurs product ──
telemetry:
  modemid: product.modem
  productid: product.serial_number
  dt: product._upd_at
  outside_temp_field: outside_tpt
  extract_temp_field: ext_tpt
  reject_temp_field: reject_tpt
  extract_speed_field: extf_spd
  supply_speed_field: vi_spd
  extract_flow_field: extf_flw
  speed_setpoint_field: set_spd
  mode_field: current_mode
  filter_field: dtb_ind

air_modes:
  - index: 0
    code: "HOLIDAYS_MODE"
    label: "Holidays"
  - index: 1
    code: "V"
    label: "Daily"
  - index: 2
    code: "Y"
    label: "Boost"
  - index: 3
    code: "X"
    label: "Guest"
  - index: 4
    code: "Z"
    label: "Air Prog"

# ── Commandes supportées ──
commands:
  - id: set_mode
    label: "Changer le mode"
    method: changeMode
    topic_pattern: "devices/{device_id}/messages/devicebound"
    params:
      - name: code
        type: enum
        options_from: air_modes

  - id: set_vacances
    label: "Programmer vacances"
    method: changeMode
    topic_pattern: "devices/{device_id}/messages/devicebound"
    params:
      - name: start
        type: datetime
      - name: end
        type: datetime

# ── Configuration UI ──
ui:
  quick_modes:
    - field: air_modes
      label: "Vitesse"
  show_thermostats: false
  show_vacations: true

# ── Home Assistant MQTT Auto-Discovery ──
ha_discovery:
  entities:
    climate: []
    water_heater: []
    sensors:
      - key: "outside_tpt"
        name: "Température extérieure"
        unit: "°C"
        device_class: "temperature"
        icon: "mdi:thermometer"
      - key: "ext_tpt"
        name: "Température extraction"
        unit: "°C"
        device_class: "temperature"
        icon: "mdi:thermometer"
      - key: "reject_tpt"
        name: "Température rejet"
        unit: "°C"
        device_class: "temperature"
        icon: "mdi:thermometer"
      - key: "extf_spd"
        name: "Vitesse extraction"
        unit: "rpm"
        icon: "mdi:fan"
      - key: "vi_spd"
        name: "Vitesse insufflation"
        unit: "rpm"
        icon: "mdi:fan"
      - key: "extf_flw"
        name: "Débit extraction"
        unit: "m³/h"
        icon: "mdi:weather-windy"
      - key: "set_spd"
        name: "Consigne vitesse"
        icon: "mdi:speedometer"
      - key: "dtb_ind"
        name: "Indicateur filtre"
        icon: "mdi:air-filter"
    select:
      - id: "aldes_air_mode"
        name: "Mode VMC"
        icon: "mdi:fan"
        options_from: air_modes
    date:
      - id: "aldes_vacation_start"
        name: "Vacances Début"
        icon: "mdi:calendar-start"
      - id: "aldes_vacation_end"
        name: "Vacances Fin"
        icon: "mdi:calendar-end"
    switch:
      - id: "aldes_vacation_enable"
        name: "Vacances Activer"
        icon: "mdi:calendar-check"
        payload_on: "on"
        payload_off: "off"
