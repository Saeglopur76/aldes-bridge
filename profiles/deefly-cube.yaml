# Profil device : DeeFly-Cube (VMC double flux)
# Reference: DEE_FLY_CUBE
id: deefly-cube
name: "DeeFly Cube"
description: "VMC double flux"
type: vmc

# ── Produits ──
products:
  DEE_FLY_CUBE:
    name: "DeeFly-Cube"
    reference_fields: []

# ── Mapping telemetrie → indicateurs product ──
telemetry:
  modemid: product.modem
  productid: product.serial_number
  dt: product._upd_at
  outside_temp_field: outside_tpt
  extract_temp_field: ext_tpt
  reject_temp_field: reject_tpt
  extract_speed_field: extf_spd
  supply_speed_field: vi_spd
  extract_flow_field: extf_flw
  speed_setpoint_field: set_spd
  mode_field: current_mode
  filter_field: dtb_ind

air_modes:
  - index: 0
    code: "HOLIDAYS_MODE"
    label: "Holidays"
  - index: 1
    code: "V"
    label: "Daily"
  - index: 2
    code: "Y"
    label: "Boost"
  - index: 3
    code: "X"
    label: "Guest"
  - index: 4
    code: "Z"
    label: "Air Prog"

# ── Commandes supportées ──
commands:
  - id: set_mode
    label: "Changer le mode"
    method: changeMode
    topic_pattern: "device/{device_id}/messages/devicebound"
    params:
      - name: code
        type: enum
        options_from: air_modes
    - id: set_vacances
    label: "Programmer vacances"
    method: changeMode
    topic_pattern: "device/{device_id}/messages/devicebound"
    params:
      - name: start
        type: datetime
      - name: end
        type: datetime
   - id: set_cmo
    label: "Override CMO"
    method: changeCMO
    topic_pattern: "device/{device_id}/messages/devicebound"
    params:
      - name: value
        type: enum
        options:
          - { code: "1", label: "ON (override)" }
          - { code: "0", label: "OFF" }

# ── Configuration UI ──
ui:
  quick_modes:
    - field: air_modes
      label: "air modes"
  show_thermostats: false
  show_vacations: true


# ── Home Assistant MQTT Auto-Discovery ──
ha_discovery:
  # Mapping modes Aldes → modes HA HVAC
  mode_mapping:
    A: "off"        # Off
    B: "heat"       # Confort (chauffage)
    C: "heat"       # Éco (chauffage)
    D: "heat"       # Programme A (chauffage)
    E: "heat"       # Programme B (chauffage)
    F: "cool"       # Confort (climatisation)
    G: "cool"       # Boost (climatisation)
    H: "cool"       # Programme C (climatisation)
    I: "cool"       # Programme D (climatisation)
  # Mapping presets HA → codes Aldes
  preset_mapping:
    none: "B"        # Confort (chauffage)
    eco: "C"         # Éco
    comfort: "B"     # Confort (chauffage)
    boost: "G"       # Boost (climatisation)
    program_a: "D"   # Programme A (chauffage)
    program_b: "E"   # Programme B (chauffage)
    program_c: "H"   # Programme C (climatisation)
    program_d: "I"   # Programme D (climatisation)
  # Entités HA à créer
  entities:
    climate:
      - id: "aldes_pac"
        name: "PAC Aldes"
        icon: "mdi:heat-pump"
        min_temp: 5
        max_temp: 30
        temp_step: 1
    sensors:
      - key: "Text"
        name: "Température extérieure"
        unit: "°C"
        device_class: "temperature"
        icon: "mdi:thermometer"
      - key: "MT0"
        name: "Température intérieure"
        unit: "°C"
        device_class: "temperature"
        icon: "mdi:thermometer"
      - key: "UAM"
        name: "Mode air"
        icon: "mdi:fog"
      - key: "MfAc"
        name: "Compresseur"
        binary: true
        device_class: "running"
        icon: "mdi:cog"
    select: []
    water_heater:
      - id: "aldes_ballon"
        name: "Ballon ECS"
        icon: "mdi:water-boiler"
    sensors:
      - key: "Text"
        name: "Température extérieure"
        unit: "°C"
        device_class: "temperature"
        icon: "mdi:thermometer"
      - key: "MT0"
        name: "Température intérieure"
        unit: "°C"
        device_class: "temperature"
        icon: "mdi:thermometer"
      - key: "UAM"
        name: "Mode air"
        icon: "mdi:fog"
      - key: "MfAc"
        name: "Compresseur"
        binary: true
        device_class: "running"
        icon: "mdi:cog"
      - key: "NED"
        name: "Niveau ECS"
        unit: "%"
        device_class: "water"
        icon: "mdi:water-percent"
      - key: "TBBa"
        name: "Ballon ECS Bas"
        unit: "°C"
        device_class: "temperature"
        icon: "mdi:thermometer"
      - key: "TBHa"
        name: "Ballon ECS Haut"
        unit: "°C"
        device_class: "temperature"
        icon: "mdi:thermometer"
    date:
      - id: "aldes_vacation_start"
        name: "Vacances Début"
        icon: "mdi:calendar-start"
      - id: "aldes_vacation_end"
        name: "Vacances Fin"
        icon: "mdi:calendar-end"
    switch:
      - id: "aldes_vacation_enable"
        name: "Vacances Activer"
        icon: "mdi:calendar-check"
        payload_on: "on"
        payload_off: "off"
